[project]
name = "blackbox"
version = "0.1.0"
description = "Evidence-first road crash investigation workspace"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    # API
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "python-multipart>=0.0.9",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",

    # Database
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "asyncpg>=0.29.0",          # Postgres async driver
    "aiosqlite>=0.20.0",        # SQLite async (dev/test)

    # Worker
    "celery>=5.4.0",
    "redis>=5.0.0",

    # Media
    "av>=12.0.0",               # PyAV — FFmpeg bindings for frame-accurate decoding
    "pillow>=10.3.0",
    "numpy>=1.26.0",
    "opencv-python-headless>=4.9.0",

    # Numerical engine
    "scipy>=1.13.0",
    "scikit-learn>=1.4.0",

    # Auth / security
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",

    # HTTP client
    "httpx>=0.27.0",

    # Export / reporting
    "jinja2>=3.1.0",
    "weasyprint>=62.0",
    "orjson>=3.10.0",

    # Utilities
    "python-dotenv>=1.0.0",
    "structlog>=24.1.0",
    "tenacity>=8.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "pre-commit>=3.7.0",
    "factory-boy>=3.3.0",
    "freezegun>=1.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "N", "UP", "B", "SIM", "ANN"]
ignore = ["ANN101", "ANN102"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["services", "engine", "evaluation"]
addopts = "--cov=. --cov-report=term-missing"
